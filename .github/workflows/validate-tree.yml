name: Validate mist tree and stock blob list (legacy/manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check Python scripts
        run: python3 -m compileall -q scripts device/xiaomi/mist
      - name: Check device tree and stock-derived proprietary entries
        run: python3 -m unittest discover -s tests -v
