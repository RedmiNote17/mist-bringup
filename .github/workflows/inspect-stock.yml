name: Inspect stock mist fastboot firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mist-inspection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify inspector tests
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Reclaim unused runner storage
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install parallel downloader
        shell: bash
        run: |
          if ! command -v aria2c >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq aria2
          fi
          aria2c --version | head -n 1

      - name: Verify manifest and inspect official Xiaomi fastboot archive
        shell: bash
        run: |
          python3 -u scripts/firmware.py \
            --manifest firmware/global-fastboot.json \
            --working-directory "$RUNNER_TEMP/mist-firmware" \
            --report-directory "$RUNNER_TEMP/mist-report"

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mist-stock-inspection-${{ github.run_number }}
          path: ${{ runner.temp }}/mist-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Show final disk space
        if: always()
        shell: bash
        run: df -h /
